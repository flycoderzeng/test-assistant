description: "添加用户"
repeat: success
type: object
properties:
  userInfo:
    type: object
    required:
      - userName
    properties:
      userName:
        description: "用户姓名"
        type: string
        minLength: 10
        maxLength: 64
        example: "test"
      occupation:
        description: "职业"
        type: integer
        enums:
          - 1
          - 2
  sex:
    description: "用户性别"
    type: integer
    enums:
      - 0
      - 1